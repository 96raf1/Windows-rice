# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗

scan_timeout = 100
command_timeout = 1000

#format  

format = """
$line_break\
[┌](fg:#9ff2e1)\
$os\
[](bg:#005046 fg:#9ff2e1)\
$directory\
[ ](bg:#83d5c6 fg:#005046)\
$git_branch\
$git_status\
[ ](bg:#cae6ff fg:#83d5c6)\
$c\
$rust\
$lua\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[ ](bg:#334b46 fg:#cae6ff)\
$cmd_duration\
[](bg:none fg:#334b46)\
$fill\
[](fg:#9ff2e1)\
$time\
[](fg:#9ff2e1)\
$line_break\
[└─](fg:#9ff2e1)\
$character"""

[fill]
symbol = ' '
style = 'fg:#3f4946'

[character]
success_symbol = "[ ](bold fg:#83d5c6)"
error_symbol = "[ ](bold fg:#ffb4ab)"

[os]
disabled = false
style = "bg:#9ff2e1 fg:#005046"

[os.symbols]
Arch = " 󰣇 "
Alpine = "  "
Amazon = "  "
Android = "  "
CentOS = "  "
Debian = "  "
DragonFly = "  "
Emscripten = "  "
EndeavourOS = "  "
Fedora = "  "
FreeBSD = "  "
Gentoo = "  "
Linux = "  "
Macos = "  "
Manjaro = "  "
Mariner = "  "
MidnightBSD = "  "
Mint = "  "
NetBSD = "  "
NixOS = "  "
openSUSE = "  "
Pop = "  "
Raspbian = "  "
Redhat = " "
RedHatEnterprise = "  "
Redox = "  "
SUSE = "  "
Ubuntu = "  "
Unknown = "  "
Windows = "  "

[package]
disabled = false

[git_branch]
style = "bg:#83d5c6"
symbol = "󰘬"
format = '[[$symbol $branch ](bold fg:#334b46 bg:#83d5c6)]($style)'

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_status]
style = "bold bg:#83d5c6"
format = '[[($all_status$ahead_behind )](fg:#334b46 bg:#83d5c6)]($style)'
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
conflicted = " =${count}"
staged = " +${count}"
modified = " !${count}"
untracked = " ?${count}"
deleted = "✘${count}"
renamed = " »${count}"
stashed = " $${count}"

[time]
disabled = false
format = '[[ $time ](fg:#0e1513 bg:#9ff2e1)]($style)'
style = "bg:#83d5c6"
time_format = "%T"

[directory]
home_symbol = ""
read_only = "  "
style = "bg:#005046 fg:#9ff2e1"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ".../"
format = '[ $path ]($style)[](bold fg:#005046)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[$duration ](bold bg:#334b46 fg:#cae6ff)'

[c]
symbol = " "
style = "bg:#83d5c6"
format = '[[$symbol($version) ](fg:#1c3530 bg:#cae6ff)]($style)'

[rust]
symbol = " "
style = "bg:#83d5c6"
format = '[[$symbol($version) ](fg:#1c3530 bg:#cae6ff)]($style)'

[python]
symbol = " "
style = "bg:#83d5c6"
format = '[[$symbol($version) ](fg:#1c3530 bg:#cae6ff)]($style)'

[nodejs]
symbol = " "
style = "bg:#83d5c6"
format = '[[$symbol($version) ](bold fg:#1c3530 bg:#cae6ff)]($style)'

[lua]
symbol = " "
style = "bg:#83d5c6"
format = '[[$symbol($version) ](fg:#1c3530 bg:#cae6ff)]($style)'
