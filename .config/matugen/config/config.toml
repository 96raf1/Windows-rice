post_hook = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Users\mdisl\AppData\Roaming\InioX\matugen\scripts\windows_term_post.ps1'

[templates.starship]
input_path = '~/AppData/Roaming/InioX/matugen/templates/starship.template'
