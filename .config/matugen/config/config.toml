[templates.nilesoft]
input_path = '~/AppData/Roaming/InioX/matugen/templates/nilesoft.template'
output_path = 'C:/Program Files/Nilesoft Shell/imports/theme.nss'

[templates.flowlauncher]
input_path = '~/AppData/Roaming/InioX/matugen/templates/flowlauncher.template'
