# This is my current matugen config.toml. It will not stay this way
[config]
version_check = false
reload_apps = false

[templates.vesktop]
input_path = '~/AppData/Roaming/InioX/matugen/templates/vesktop-system24.template'
output_path = '~/AppData/Roaming/vesktop/themes/system24.css'

[templates.kotofetch]
input_path = '~/AppData/Roaming/InioX/matugen/templates/kotofetch.template'
output_path = '~/AppData/Roaming/kotofetch/config.toml'

[templates.yasb]
input_path = '~/AppData/Roaming/InioX/matugen/templates/yasb-colors.template'
output_path = '~/.cache/matugen/yasb-colors.css'

[templates.cava]
input_path = '~/AppData/Roaming/InioX/matugen/templates/cava.template'
